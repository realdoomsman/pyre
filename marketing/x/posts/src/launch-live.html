<!doctype html>
<html><head><meta charset="utf-8"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
:root{--bg:#08090b;--fg:#f3f5f7;--fg2:#9ba5b4;--fg3:#7c8798;--line:#1e232c;--line2:#2d3440;--g:#35d07f;--r:#f2564d;}
html,body{margin:0;padding:0;}
#c{width:1600px;height:900px;background:var(--bg);position:relative;overflow:hidden;font-family:Inter,sans-serif;color:var(--fg);}
#grid{position:absolute;inset:0;background-image:linear-gradient(#0f141a 1px,transparent 1px),linear-gradient(90deg,#0f141a 1px,transparent 1px);background-size:40px 40px;opacity:.55;-webkit-mask-image:radial-gradient(120% 120% at 50% 0%,#000 45%,transparent 85%);mask-image:radial-gradient(120% 120% at 50% 0%,#000 45%,transparent 85%);}
#dither{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(53,208,127,.06) 0 3px,transparent 3px 10px);-webkit-mask-image:radial-gradient(80% 80% at 50% 55%,transparent 55%,#000);mask-image:radial-gradient(80% 80% at 50% 55%,transparent 55%,#000);}
#wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;}
.brand{display:flex;align-items:center;gap:18px;}
.brand .w{font-family:Silkscreen,monospace;font-size:52px;letter-spacing:2px;}
.pill{display:inline-flex;align-items:center;gap:12px;font-family:Silkscreen,monospace;font-size:18px;letter-spacing:4px;color:#08090b;background:var(--g);padding:12px 22px;box-shadow:4px 4px 0 rgba(0,0,0,.5);text-transform:uppercase;}
.pill .dot{width:12px;height:12px;background:#08090b;display:inline-block;}
h1{font-weight:700;font-size:132px;letter-spacing:-3px;line-height:.9;margin:6px 0 0;}
.sub{font-family:Silkscreen,monospace;font-size:22px;letter-spacing:5px;color:#9ba5b4;text-transform:uppercase;}
.loop{font-size:30px;color:#c7cfdb;margin-top:4px;} .loop .g{color:var(--g);} .loop .r{color:var(--r);}
.rule{width:640px;height:1px;background:var(--line);margin:10px 0;}
.ca{font-family:'JetBrains Mono',monospace;font-size:26px;color:#c7cfdb;border:1px solid #2d3440;background:#0d0f13;padding:14px 24px;box-shadow:4px 4px 0 rgba(0,0,0,.5);} .ca b{color:#7c8798;font-weight:500;letter-spacing:1px;}
#foot{position:absolute;left:0;right:0;bottom:44px;display:flex;align-items:center;justify-content:center;gap:26px;}
#foot .u{font-family:Silkscreen,monospace;font-size:24px;letter-spacing:2px;}
#foot .p{font-size:20px;color:#7c8798;}
</style></head>
<body>
<div id="c">
  <div id="grid"></div><div id="dither"></div>
  <div id="wrap">
    <div class="pill"><span class="dot"></span>now live on pump.fun</div>
    <div class="brand"><span id="mark"></span><span class="w">berth</span></div>
    <h1>we're live.</h1>
    <div class="sub">coins that build apps</div>
    <div class="loop"><span class="g">fees</span> fund the build. <span class="r">revenue</span> funds the burn.</div>
    <div class="rule"></div>
    <div class="ca" id="ca"><b>$BERTH CA</b> &nbsp; <span id="cav"></span></div>
  </div>
  <div id="foot"><span class="u">berth.fun</span><span class="p">not financial advice</span></div>
</div>
<script>
window.BERTH_MARK=["................",".......##.......","......####......",".....######.....","....########....","...##########...","..############..","..##..####..##..","......####......","......####......","......####......","................","................",".######..######.",".######..######.","................"];
window.markSvg=function(s,c){let r="";for(let y=0;y<16;y++)for(let x=0;x<16;x++){if(window.BERTH_MARK[y][x]==='#')r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}return `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="${c}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${r}</svg>`;};
document.getElementById('mark').innerHTML=window.markSvg(56,'#35d07f');
const ca=new URLSearchParams(location.search).get('ca');
document.getElementById('cav').textContent = ca && ca.length>6 ? ca : 'paste your mint here at launch';
if(!(ca&&ca.length>6)){ document.getElementById('cav').style.color='#5b6472'; }
</script>
</body></html>
