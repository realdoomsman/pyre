<!doctype html>
<html><head><meta charset="utf-8"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600&display=swap');
html,body{margin:0;padding:0;}
#c{width:1600px;height:900px;background:#08090b;position:relative;overflow:hidden;font-family:Inter,sans-serif;color:#f3f5f7;box-sizing:border-box;padding:64px 72px 60px;}
#grid{position:absolute;inset:0;background-image:linear-gradient(#0f141a 1px,transparent 1px),linear-gradient(90deg,#0f141a 1px,transparent 1px);background-size:40px 40px;opacity:.5;-webkit-mask-image:radial-gradient(130% 120% at 10% -10%,#000 40%,transparent 80%);mask-image:radial-gradient(130% 120% at 10% -10%,#000 40%,transparent 80%);}
#hd{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;}
.brand{display:flex;align-items:center;gap:13px;}
.brand .w{font-family:Silkscreen,monospace;font-size:26px;letter-spacing:1px;}
.kick{font-family:Silkscreen,monospace;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:#7c8798;}
#panel{position:relative;z-index:2;height:600px;border:1px solid #2d3440;background:#0d0f13;box-shadow:6px 6px 0 rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;overflow:hidden;}
#bar{position:absolute;top:0;left:0;right:0;height:34px;background:#0b0d11;border-bottom:1px solid #1e232c;display:flex;align-items:center;gap:8px;padding:0 14px;box-sizing:border-box;}
#bar i{width:10px;height:10px;background:#2d3440;display:inline-block;}
#bar i.g{background:#35d07f;}
#shot{max-width:100%;max-height:calc(600px - 34px);margin-top:34px;object-fit:contain;display:block;}
#ft{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;margin-top:26px;}
#ft .tag{font-size:20px;color:#7c8798;} #ft .tag .g{color:#35d07f;}
#ft .url{font-family:Silkscreen,monospace;font-size:20px;letter-spacing:2px;}
</style></head>
<body>
<div id="c">
  <div id="grid"></div>
  <div id="hd"><div class="brand"><span id="mark"></span><span class="w">berth</span></div><div class="kick" id="kick"></div></div>
  <div id="panel"><div id="bar"><i class="g"></i><i></i><i></i></div><img id="shot"/></div>
  <div id="ft"><div class="tag">fees fund the build. <span class="g">revenue funds the burn.</span></div><div class="url">berth.fun</div></div>
</div>
<script src="../../brand/src/mark.js"></script>
<script>
  const p=new URLSearchParams(location.search);
  document.getElementById('mark').innerHTML=window.markSvg(26,'#35d07f');
  document.getElementById('kick').textContent=(p.get('kick')||'').toUpperCase();
  const img=p.get('img'); if(img){ document.getElementById('shot').src = img.startsWith('file')?img:('file:///'+img); }
</script>
</body></html>
