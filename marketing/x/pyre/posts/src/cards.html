<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pyre — X post cards</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');
  :root{
    --canvas:#0A0A0C;--surface:#121215;--raised:#18181D;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
    --ink:#F3F2EE;--ink2:#9B9891;--ink3:#62605B;--accent:#9D8CFF;--accent2:#7A66F5;--build:#3E8BFF;--earn:#4FD1A6;--burn:#FF4D6D;--warn:#E5C15C;--hot:#E9F1FF;
    --paper:#F4F1EA;--paper-ink:#141311;
  }
  html,body{margin:0;background:#000}
  *{box-sizing:border-box}
  #c{width:1600px;height:900px;background:var(--canvas);position:relative;overflow:hidden;color:var(--ink);font-family:Geist,system-ui,sans-serif;font-variant-numeric:tabular-nums}
  #heat{position:absolute;left:0;right:0;bottom:0;height:260px;pointer-events:none;
    background:radial-gradient(60% 55% at 50% 100%, rgba(156,210,255,.14), rgba(62,139,255,.10) 30%, rgba(122,102,245,.05) 58%, transparent 80%),
               linear-gradient(180deg, transparent, rgba(28,27,46,.35) 60%, rgba(59,47,122,.28));}
  #lip{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg, transparent, #9CD2FF 25%, #E9F1FF 50%, #9CD2FF 75%, transparent)}
  #hd{position:absolute;left:72px;right:72px;top:56px;display:flex;align-items:center;justify-content:space-between;z-index:3}
  #hd img{height:54px;display:block}
  #hd .k{font:400 15px/1 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);display:flex;gap:28px}
  #hd .k b{font-weight:500;color:var(--ink)}
  #ft{position:absolute;left:72px;right:72px;bottom:44px;display:flex;justify-content:space-between;z-index:3;font:400 14px/1 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
  #b{position:absolute;left:72px;right:72px;top:150px;bottom:100px;z-index:2}

  h1{font:400 64px/1.04 'Instrument Serif',serif;letter-spacing:-.02em;margin:0;color:var(--ink)}
  h1 em{font-style:italic;color:var(--accent)}
  h1.sm{font-size:52px}
  .lead{font:400 24px/1.35 Geist,sans-serif;color:var(--ink2);margin-top:18px;max-width:1100px}
  .mono{font-family:'Geist Mono',monospace}
  .lab{font:500 13px/1 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
  .cap{font:400 15px/1.4 'Geist Mono',monospace;color:var(--ink3);letter-spacing:.02em}
  .accent{color:var(--accent)} .build{color:var(--build)} .earn{color:var(--earn)} .burn{color:var(--burn)} .ink2{color:var(--ink2)} .ink3{color:var(--ink3)} .hot{color:var(--hot)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
  .frame{background:var(--surface);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
  .frame .bar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);font:400 13px/1 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
  .shot{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#000}
  .shot img{display:block;width:100%}

  /* 01 loop */
  .loop{display:grid;grid-template-columns:repeat(4,1fr) 90px;grid-template-rows:1fr 1fr;gap:18px 0;margin-top:36px;height:470px}
  .loop .n{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-right:56px;display:flex;flex-direction:column;justify-content:space-between}
  .loop .n .s{font:500 13px/1 'Geist Mono',monospace;letter-spacing:.06em;color:var(--ink3)}
  .loop .n .t{font:400 34px/1.05 'Instrument Serif',serif;letter-spacing:-.02em;margin-top:10px}
  .loop .n .d{font:400 16px/1.35 Geist,sans-serif;color:var(--ink2);margin-top:12px}
  .loop .n::after{content:'→';position:absolute;right:-44px;top:50%;transform:translateY(-50%);font:400 30px/1 'Geist Mono',monospace;color:var(--ink3)}
  .loop .n.rev::after{content:'←'}
  .loop .n.last::after{content:''}
  .loop .turn{grid-column:5;grid-row:1/3;display:flex;align-items:center;justify-content:center;font:400 30px/1 'Geist Mono',monospace;color:var(--ink3);border-right:1px solid var(--line2);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);border-radius:0 24px 24px 0;margin:40px 0}
  .loop .n.hotn{border-color:rgba(157,140,255,.35);background:linear-gradient(180deg,var(--surface),rgba(59,47,122,.18))}
  .loop .n.burnn{border-color:rgba(255,77,109,.35)}
  .loopback{position:absolute;left:0;right:150px;bottom:-4px;height:0;border-top:1px dashed var(--line2)}
  .loopback span{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:var(--canvas);padding:0 16px;font:400 15px/1 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}

  /* 02 fee split */
  .bar{display:flex;height:118px;border-radius:10px;overflow:hidden;margin-top:14px}
  .bar div{display:flex;flex-direction:column;justify-content:center;padding:0 22px;font-family:'Geist Mono',monospace}
  .bar .v{font-size:34px;line-height:1;color:var(--ink)}
  .bar .l{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-top:8px;color:rgba(243,242,238,.75)}
  .bracket{height:34px;margin:6px 0;border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);border-bottom-left-radius:10px;position:relative}
  .bracket::after{content:'↓';position:absolute;right:0;bottom:-12px;font:400 22px/1 'Geist Mono',monospace;color:var(--ink3)}
  .row{display:flex;align-items:baseline;justify-content:space-between;margin-top:28px}
  .row .lab{font-size:14px}
  .row .big{font:400 44px/1 'Instrument Serif',serif;letter-spacing:-.02em}

  /* 03 revenue */
  .cols{display:flex;align-items:flex-end;gap:28px;height:420px;margin-top:30px}
  .col{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
  .col .fill{border-radius:10px 10px 0 0;display:flex;align-items:flex-end;padding:20px}
  .col .pct{font:400 72px/1 'Instrument Serif',serif;letter-spacing:-.02em}
  .col .who{font:500 13px/1 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
  .seq{display:flex;flex-direction:column;gap:14px;margin-left:40px;flex:1;height:100%;justify-content:flex-end;padding-bottom:44px}
  .seq .st{display:flex;gap:18px;align-items:baseline;border-top:1px solid var(--line);padding-top:14px}
  .seq .st .n{font:400 13px/1 'Geist Mono',monospace;color:var(--ink3);width:30px}
  .seq .st .t{font:400 22px/1.3 Geist,sans-serif}
  .seq .st .t code{font-family:'Geist Mono',monospace;color:var(--ink)}

  /* 04 bytes */
  .bytes{display:flex;flex-wrap:wrap;gap:8px;margin-top:40px;max-width:1290px}
  .byte{width:57px;height:64px;border:1px solid var(--line2);border-radius:6px;display:flex;align-items:center;justify-content:center;font:400 22px/1 'Geist Mono',monospace;color:var(--ink2);background:var(--surface)}
  .byte.p{border-color:var(--accent);color:var(--accent);background:rgba(157,140,255,.08)}
  .byte.v{border-color:var(--warn);color:var(--warn);background:rgba(229,193,92,.08)}
  .byte.h{color:var(--ink)}
  .legend{display:flex;gap:44px;margin-top:22px}
  .legend div{display:flex;gap:12px;align-items:center;font:400 16px/1 'Geist Mono',monospace;color:var(--ink2)}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid}
  .work{margin-top:34px;display:grid;grid-template-columns:auto 1fr;gap:12px 28px;font:400 18px/1.4 'Geist Mono',monospace;border-top:1px solid var(--line);padding-top:24px}
  .work .k{color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding-top:5px}

  /* 05 curve */
  .curve{position:relative;margin-top:26px;height:420px}
  .curve svg{position:absolute;inset:0}
  .curve .tag{position:absolute;font:400 13px/1 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
  .curve .ph{position:absolute;top:0;font:400 15px/1.5 Geist,sans-serif;color:var(--ink2);width:380px}
  .curve .ph b{display:block;font:400 30px/1.05 'Instrument Serif',serif;letter-spacing:-.02em;color:var(--ink);font-weight:400;margin-bottom:8px}
  .addr{display:grid;grid-template-columns:auto 1fr;gap:8px 28px;font:400 15px/1.5 'Geist Mono',monospace;color:var(--ink2);margin-top:8px}
  .addr .k{color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;font-size:12px;padding-top:3px}

  /* 06 scope table */
  .scope{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;margin-top:34px}
  .scope .h{font:400 34px/1 'Instrument Serif',serif;letter-spacing:-.02em;padding-bottom:16px;border-bottom:1px solid var(--line2)}
  .scope ul{list-style:none;margin:0;padding:0}
  .scope li{display:flex;gap:16px;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--line);font:400 21px/1.3 Geist,sans-serif}
  .scope li i{font:400 18px/1 'Geist Mono',monospace;width:22px;flex:none}
  .scope li code{font:400 19px/1 'Geist Mono',monospace;color:var(--ink)}
  .scope li .why{color:var(--ink3);font-size:15px;margin-left:auto;font-family:'Geist Mono',monospace;white-space:nowrap;flex:none;padding-left:12px}
  .strip{display:flex;gap:0;margin-top:32px;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
  .strip div{flex:1;padding:18px 22px;border-right:1px solid var(--line)}
  .strip div:last-child{border-right:0}
  .strip .v{font:400 20px/1.2 'Geist Mono',monospace;color:var(--ink);margin-top:10px}

  /* 07 terminal */
  .term{margin-top:30px;font:400 20px/1.75 'Geist Mono',monospace;padding:22px 28px}
  .term .ln{display:grid;grid-template-columns:36px 420px 1fr;gap:0 20px;white-space:pre}
  .term .p{color:var(--ink3)} .term .cmd{color:var(--ink)} .term .ok{color:var(--earn)} .term .fail{color:var(--burn)} .term .dim{color:var(--ink3)}
  .term .gate{color:var(--accent)}

  /* 08 state */
  .state{display:grid;grid-template-columns:1fr 360px 1fr;gap:0;align-items:center;margin-top:8px}
  .tile{width:170px;height:170px;border-radius:38px;position:relative;overflow:hidden;background:var(--raised);margin:0 auto}
  .tile.lit{background:linear-gradient(180deg,#1C1C22 0%,#141418 30%,#1C1B2E 50%,#3B2F7A 66%,#7A66F5 80%,#3E8BFF 90%,#9CD2FF 96%,#E9F1FF 100%)}
  .tile.lit::after{content:'';position:absolute;left:0;right:0;bottom:0;height:60%;background:radial-gradient(70% 60% at 50% 100%,rgba(233,241,255,.95),rgba(156,210,255,.6) 20%,rgba(62,139,255,.25) 45%,transparent 75%)}
  .tile.ash{background:#141416;border:1px solid var(--line2)}
  .tile.ash::after{content:'';position:absolute;left:0;right:0;top:46%;height:1px;background:var(--ink3);opacity:.5}
  .sname{text-align:center;margin-top:20px;font:400 40px/1 'Instrument Serif',serif;letter-spacing:-.02em}
  .sdesc{text-align:center;margin-top:10px;font:400 16px/1.4 Geist,sans-serif;color:var(--ink2)}
  .arrows{display:flex;flex-direction:column;gap:44px}
  .arrows div{font:400 15px/1.45 'Geist Mono',monospace;color:var(--ink2);text-align:center;position:relative;padding:0 8px}
  .arrows div::before{content:'';display:block;height:1px;background:var(--line2);margin-bottom:12px}
  .arrows div.fwd::after{content:'→';position:absolute;right:-6px;top:-15px;color:var(--ink3);font-size:22px}
  .arrows div.back::after{content:'←';position:absolute;left:-6px;top:-15px;color:var(--ink3);font-size:22px}

  /* 09 rank */
  .rank{display:grid;grid-template-columns:1fr 380px;gap:44px;margin-top:26px;align-items:start}
  .kv{border-top:1px solid var(--line2)}
  .kv div{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line);font:400 20px/1 Geist,sans-serif}
  .kv div span:last-child{font-family:'Geist Mono',monospace;font-size:16px}

  /* 10 wallets */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px}
  .two .panel{padding:24px 28px}
  .two .panel .t{font:400 30px/1.05 'Instrument Serif',serif;letter-spacing:-.02em}
  .two .panel .m{font:400 16px/1.5 'Geist Mono',monospace;color:var(--ink2);margin-top:12px}
  .two .panel .m b{color:var(--ink);font-weight:400}
  .flow{margin-top:26px;position:relative;height:250px}
  .flow .act{position:absolute;top:0;width:250px;text-align:center}
  .flow .act .box{border:1px solid var(--line2);border-radius:12px;background:var(--surface);padding:18px 14px;font:400 24px/1.1 'Instrument Serif',serif;letter-spacing:-.02em}
  .flow .act .sub{font:400 13px/1.4 'Geist Mono',monospace;color:var(--ink3);margin-top:8px;letter-spacing:.04em}
  .flow .msg{position:absolute;height:0;border-top:1px solid var(--line2)}
  .flow .msg::after{content:'▸';position:absolute;right:-6px;top:-11px;color:var(--ink2);font-size:18px}
  .flow .msg span{position:absolute;left:0;right:0;top:14px;text-align:center;font:400 15px/1.4 'Geist Mono',monospace;color:var(--ink);padding:0 18px}
  .flow .msg span i{display:block;font-style:normal;color:var(--ink3);font-size:13px;margin-top:4px}

  /* 11 diff */
  .diff{margin-top:26px;font:400 19px/1.7 'Geist Mono',monospace}
  .diff .ln{display:grid;grid-template-columns:70px 1fr 300px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.04);background:rgba(255,77,109,.05)}
  .diff .ln .no{color:var(--ink3)} .diff .ln .code{color:var(--ink);white-space:pre} .diff .ln .code .plus{color:var(--burn)}
  .diff .ln .tag{color:var(--burn);text-align:right;letter-spacing:.06em;text-transform:uppercase;font-size:14px;line-height:32px}
  .diff .ln.ok{background:rgba(79,209,166,.05)} .diff .ln.ok .tag{color:var(--earn)}

  /* 12 reconcile */
  .grid7{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:30px}
  .g{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;min-height:205px}
  .g .k{font:500 14px/1 'Geist Mono',monospace;letter-spacing:.08em;color:var(--accent)}
  .g .i{font:400 13px/1 'Geist Mono',monospace;color:var(--ink3);float:right}
  .g .d{font:400 18px/1.45 Geist,sans-serif;color:var(--ink2);margin-top:14px}
  .g .d b{color:var(--ink);font-weight:500}
  .g.tick{background:transparent;border-style:dashed;display:flex;flex-direction:column;justify-content:center}
  .g.tick .big{font:400 54px/1 'Instrument Serif',serif;letter-spacing:-.02em}

  /* 13 finding */
  .finding{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .sev{display:inline-block;font:500 13px/1 'Geist Mono',monospace;letter-spacing:.1em;padding:8px 12px;border-radius:6px;border:1px solid var(--burn);color:var(--burn)}
  .sev.ok{border-color:var(--earn);color:var(--earn)}
  .fx{padding:26px 30px}
  .fx .t{font:400 32px/1.1 'Instrument Serif',serif;letter-spacing:-.02em;margin-top:16px}
  .fx ul{margin:16px 0 0;padding:0;list-style:none}
  .fx li{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--line);font:400 18px/1.35 Geist,sans-serif;color:var(--ink2)}
  .fx li i{font-style:normal;font-family:'Geist Mono',monospace;color:var(--ink3);width:26px;flex:none}
  .fx li code{font-family:'Geist Mono',monospace;color:var(--ink);font-size:16px}

  /* 14 numbers */
  .nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin-top:40px;border-top:1px solid var(--line2)}
  .num{padding:36px 32px 30px 0;border-right:1px solid var(--line)}
  .num:last-child{border-right:0;padding-left:32px} .num:nth-child(2){padding-left:32px}
  .num .v{font:400 150px/1 'Instrument Serif',serif;letter-spacing:-.03em}
  .num .v small{font-size:60px;color:var(--ink3)}
  .num .l{font:500 14px/1 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-top:18px}
  .num .n{font:400 17px/1.45 Geist,sans-serif;color:var(--ink3);margin-top:12px}

  /* 15 design */
  .ds{display:grid;grid-template-columns:420px 1fr;gap:56px;margin-top:22px;align-items:start}
  .sw{display:flex;gap:10px;margin-top:16px}
  .sw div{flex:1;height:64px;border-radius:8px;position:relative;border:1px solid var(--line)}
  .sw div span{position:absolute;left:8px;bottom:6px;font:400 11px/1 'Geist Mono',monospace;letter-spacing:.04em;color:rgba(243,242,238,.8)}
  .ramp{margin-top:22px;display:flex;gap:22px;align-items:stretch}
  .ramp .r{width:80px;border-radius:8px;background:linear-gradient(180deg,#1C1B2E,#3B2F7A,#7A66F5,#3E8BFF,#9CD2FF,#E9F1FF)}
  .type{flex:1}
  .type div{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
  .type .a{font:400 36px/1 'Instrument Serif',serif;letter-spacing:-.02em}
  .type .b{font:500 24px/1 Geist,sans-serif}
  .type .c{font:400 22px/1 'Geist Mono',monospace}
  .type .lab{font-size:12px}

  /* 16 trays */
  .trays{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:22px}
  .tray{background:var(--surface);border:1px solid var(--line2);border-radius:20px 20px 12px 12px;padding:14px 22px 22px;min-height:480px;position:relative}
  .tray .handle{width:36px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 18px}
  .tray .rail{display:flex;gap:10px;font:500 15px/1 Geist,sans-serif;align-items:baseline;color:var(--ink3)}
  .tray .rail .n{font:400 12px/1 'Geist Mono',monospace}
  .tray .rail .cur{color:var(--ink)} .tray .rail .cur .n{color:var(--accent)}
  .tray .prog{height:1px;background:var(--line);margin:12px 0 22px;position:relative}
  .tray .prog i{position:absolute;left:0;top:0;height:1px;background:var(--accent)}
  .tray .f{margin-top:12px}
  .tray .f .l{font:500 11px/1 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
  .tray .f .in{border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font:400 16px/1.3 Geist,sans-serif;color:var(--ink);background:var(--raised);min-height:40px}
  .tray .f .in.muted{color:var(--ink2)}
  .tray .btn{margin-top:18px;display:inline-block;background:var(--accent);color:#0A0A0C;font:500 15px/1 Geist,sans-serif;padding:12px 18px;border-radius:999px}
  .tray .spec{font:400 15px/1.5 Geist,sans-serif;color:var(--ink2)}
  .tray .spec b{color:var(--ink);font-weight:500}
  .tray .spec div{padding:8px 0;border-bottom:1px solid var(--line)}
  .tray .sum{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font:400 14px/1.4 'Geist Mono',monospace;color:var(--ink2)}
  .tray .sum b{display:block;color:var(--ink);font-weight:400;font-size:17px}

  /* 17 verify */
  .verify{display:grid;grid-template-columns:520px 1fr;gap:40px;margin-top:22px;align-items:start}
  .steps{counter-reset:s}
  .steps div{position:relative;padding:16px 0 16px 58px;border-bottom:1px solid var(--line);font:400 19px/1.4 Geist,sans-serif;color:var(--ink2)}
  .steps div b{color:var(--ink);font-weight:500}
  .steps div code{font-family:'Geist Mono',monospace;color:var(--ink);font-size:16px}
  .steps div::before{counter-increment:s;content:'0' counter(s);position:absolute;left:0;top:19px;font:400 15px/1 'Geist Mono',monospace;color:var(--accent);letter-spacing:.06em}

  /* 18 live/next */
  .ln2{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:28px}
  .ln2 .h{font:400 34px/1 'Instrument Serif',serif;letter-spacing:-.02em;padding-bottom:14px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:baseline}
  .ln2 ul{list-style:none;margin:0;padding:0}
  .ln2 li{display:flex;gap:16px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line);font:400 20px/1.3 Geist,sans-serif}
  .ln2 li i{width:10px;height:10px;border-radius:99px;flex:none;position:relative;top:-2px}
  .ln2 .live i{background:var(--accent)} .ln2 .next i{border:1px solid var(--ink3)}
  .ln2 li .r{margin-left:auto;font:400 14px/1 'Geist Mono',monospace;color:var(--ink3)}

  /* 19 faq */
  .faq{margin-top:10px}

{ slug:"reconcile", kick:"reconcile worker", body:`
  <h1 class="sm">seven checks, every five minutes, in this order.</h1>
  <div class="grid7">
    <div class="g"><span class="i">01</span><div class="k">JOBS</div><div class="d">settle builds whose runner died. recover queued rows that lost their queue job. <b>a runner crash is survivable.</b></div></div>
    <div class="g"><span class="i">02</span><div class="k">SANDBOXES</div><div class="d">every live microvm is billed until its own timeout. <b>kill any whose build already settled.</b></div></div>
    <div class="g"><span class="i">03</span><div class="k">JOBTOKENS</div><div class="d">a live token is a spendable credential on the model proxy. <b>revoke and delete any whose build is finished.</b></div></div>
    <div class="g"><span class="i">04</span><div class="k">PAYOUTS</div><div class="d">treasury payouts broadcast but unconfirmed. <b>read the receipt, finalise or flag.</b></div></div>
    <div class="g"><span class="i">05</span><div class="k">LEDGER</div><div class="d">assert the money invariants. <b>reports, never repairs:</b> an automatic fix would destroy the evidence.</div></div>
    <div class="g"><span class="i">06</span><div class="k">FEES</div><div class="d">every <b>Claimed</b> the escrow emitted for an app wallet must have a fee event. missing ones are replayed, idempotent on tx hash.</div></div>
    <div class="g"><span class="i">07</span><div class="k">BURNS</div><div class="d">the ledger's burned total per app is compared with the chain. <b>the ledger can never exceed the chain.</b></div></div>
    <div class="g tick"><div class="lab">cadence</div><div class="big">5 min</div><div class="d" style="margin-top:6px">one ReconcileRun row per check, per pass.</div></div>
  </div>`,
  ftr:"12 / 21" },

{ slug:"security-review", kick:"independent security review", body:`
  <h1 class="sm">one high. fixed. here is exactly what it was.</h1>
  <div class="finding">
    <div class="panel fx">
      <span class="sev">high · before</span>
      <div class="t">treasury drain through the launch stake</div>
      <ul>
        <li><i>01</i><span>an external-wallet launcher submits a tx hash as their 0.05 ETH stake.</span></li>
        <li><i>02</i><span>the hash could be <b class="ink">any inbound treasury transaction</b>: a fee sweep, an escrow claim, someone else's stake.</span></li>
        <li><i>03</i><span>the stake is refunded at the first build. the treasury pays out money that was never staked.</span></li>
      </ul>
    </div>
    <div class="panel fx">
      <span class="sev ok">fixed · settleStake</span>
      <div class="t">the tx must prove it is this launcher's stake</div>
      <ul>
        <li><i>+</i><span>mined and successful, <code>to</code> = treasury, <code>value ≥ stake</code></span></li>
        <li><i>+</i><span><code>from</code> = the launcher's proven <code>authWallet</code>, never a platform wallet</span></li>
        <li><i>+</i><span>one hash settles one launch: <code>App.stakeTx</code> is unique, enforced by the database</span></li>
        <li><i>+</i><span>overpayment is not refunded beyond the stake</span></li>
      </ul>

{ slug:"verify-burn", kick:"verify a burn", body:`
  <h1 class="sm">check a burn yourself. it takes four minutes.</h1>

/* isometric supply kiln, same geometry as apps/web/src/ui/SupplyKiln.tsx */
const kiln = (layers, hollow, recent) => {
  const w = 120, h = 18, pad = 8, cx0 = pad + w/2, half = w/2, q = w/4;
  let out = "";
  for (let k = 0; k < layers; k++) {
    const top = pad + (layers - 1 - k) * h;
    const isHollow = k >= layers - hollow;
    const isRecent = k === recent;
    const stroke = isRecent ? "#9D8CFF" : isHollow ? "#62605B" : "#F3F2EE";
    const fo = isHollow ? 0 : 1;
    const left = `${cx0-half},${top+q} ${cx0},${top+half} ${cx0},${top+half+h} ${cx0-half},${top+q+h}`;
    const right = `${cx0+half},${top+q} ${cx0},${top+half} ${cx0},${top+half+h} ${cx0+half},${top+q+h}`;
    const topP = `${cx0},${top} ${cx0+half},${top+q} ${cx0},${top+half} ${cx0-half},${top+q}`;
    out += `<g>
      <polygon points="${left}" fill="#121215" fill-opacity="${fo}" stroke="${stroke}" stroke-width="1" stroke-linejoin="round"/>
      <polygon points="${right}" fill="#18181D" fill-opacity="${fo}" stroke="${stroke}" stroke-width="1" stroke-linejoin="round"/>
      <polygon points="${topP}" fill="${isRecent ? '#3B2F7A' : '#1E1E24'}" fill-opacity="${fo}" stroke="${stroke}" stroke-width="1" stroke-linejoin="round" ${isHollow ? 'stroke-dasharray="3 3"' : ''}/>
    </g>`;
  }
  return out;
};

const q = new URLSearchParams(location.search);
const idx = Math.max(1, Math.min(CARDS.length, Number(q.get("card") || 1)));
const card = CARDS[idx - 1];

document.getElementById("b").innerHTML = card.body;
document.getElementById("ftr").textContent = card.ftr;
const k = document.getElementById("kiln");
if (k) k.innerHTML = kiln(10, 3, 6);
window.CARDS = CARDS;
</script>
