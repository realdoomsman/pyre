<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0A0A0C;width:1600px;height:900px;overflow:hidden}
  #stage{position:relative;width:1600px;height:900px;background:#0A0A0C;color:#F3F2EE;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .mono{font-family:"Geist Mono",monospace;letter-spacing:.06em;text-transform:uppercase}
  .serif{font-family:"Instrument Serif",serif;font-weight:400;letter-spacing:-0.02em;line-height:1.05}
  #heat{position:absolute;left:0;right:0;bottom:0;height:300px;opacity:.55;
    background:linear-gradient(to top,#E9F1FF 0%,#9CD2FF 7%,#3E8BFF 18%,#7A66F5 38%,#3B2F7A 62%,#1C1B2E 82%,rgba(10,10,12,0) 100%)}
  #heatcore{position:absolute;left:50%;bottom:-140px;width:1200px;height:280px;transform:translateX(-50%);
    background:radial-gradient(ellipse at center,rgba(233,241,255,.9) 0%,rgba(156,210,255,.4) 35%,rgba(122,102,245,.14) 60%,rgba(10,10,12,0) 75%);filter:blur(6px)}
  .label{font-size:24px;color:#9B9891;margin-bottom:26px}
  .h1{font-size:120px}
  .h1 .accent{color:#9D8CFF;font-style:italic}
  .ca{font-family:"Geist Mono",monospace;font-size:40px;letter-spacing:.02em;color:#F3F2EE;
    margin-top:48px;padding:28px 40px;border:1px solid rgba(157,140,255,.4);border-radius:16px;background:#121215;
    box-shadow:0 0 44px rgba(122,102,245,.16)}
  .facts{display:flex;gap:22px;margin-top:40px}
  .fact{padding:18px 26px;border:1px solid rgba(243,242,238,.12);border-radius:12px;background:rgba(18,18,21,.85);text-align:left}
  .fact .k{font-size:17px;color:#8A877F}
  .fact .v{font-family:Geist,sans-serif;font-size:27px;color:#F3F2EE;margin-top:8px}
  .fact .v .num{font-family:"Geist Mono",monospace;color:#9D8CFF}
  #foot{position:absolute;left:56px;bottom:34px;font-size:19px;color:#8A877F}
  #foot2{position:absolute;right:56px;bottom:34px;font-size:19px;color:#8A877F}
</style></head>
<body>
<div id="stage">
  <div id="heat"></div><div id="heatcore"></div>
  <div class="mono label">fair launch on pump.fun · solana</div>
  <div class="serif h1">PYRE is <span class="accent">live on solana.</span></div>
  <div class="ca">5H3MALVQ1swoJcyMyADfc7esbJomRLsKRyG8WjbG6fg5</div>
  <div class="facts">
    <div class="fact"><div class="mono k">dev buy</div><div class="v"><span class="num">2 SOL</span> locked to oct 2027</div></div>
    <div class="fact"><div class="mono k">creator fees</div><div class="v"><span class="num">100%</span> to the pyre treasury</div></div>
    <div class="fact"><div class="mono k">refunds</div><div class="v"><span class="num">25%</span> pays back robinhood holders</div></div>
  </div>
  <div class="mono" id="foot">PYRE.FUN</div>
  <div class="mono" id="foot2">coins that build apps</div>
</div>
</body></html>
