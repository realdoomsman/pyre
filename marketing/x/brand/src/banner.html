<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  html, body { margin: 0; padding: 0; }
  #stage {
    width: 1500px; height: 500px;
    background: #08090b;
    position: relative;
    overflow: hidden;
    color: #f3f5f7;
  }
  #grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(#0f141a 1px, transparent 1px),
      linear-gradient(90deg, #0f141a 1px, transparent 1px);
    background-size: 30px 30px;
    opacity: 0.6;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 100%);
            mask-image: linear-gradient(90deg, transparent, #000 30%, #000 100%);
  }
  /* dithered accent block, bottom-right, the product's own texture */
  #dither {
    position: absolute; right: 0; bottom: 0; width: 520px; height: 500px;
    background: repeating-linear-gradient(45deg, rgba(53,208,127,0.10) 0 3px, transparent 3px 8px);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 80%);
            mask-image: linear-gradient(90deg, transparent, #000 80%);
  }
  #wrap {
    position: absolute; inset: 0;
    display: flex; align-items: center;
    padding: 0 96px;
    box-sizing: border-box;
  }
  #left { display: flex; flex-direction: column; gap: 18px; }
  #brandrow { display: flex; align-items: center; gap: 22px; }
  #mark { line-height: 0; filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.6)); }
  #word { font-family: Silkscreen, monospace; font-size: 96px; letter-spacing: 2px; line-height: 0.8; }
  #tag { font-family: Silkscreen, monospace; font-size: 20px; letter-spacing: 3px; color: #9ba5b4; text-transform: uppercase; }
  #rule { width: 620px; height: 1px; background: #1e232c; margin-top: 6px; }
  #loop { font-family: 'JetBrains Mono', monospace; font-size: 25px; line-height: 1.7; color: #9ba5b4; }
  #loop b { color: #f3f5f7; font-weight: 500; }
  #loop .g { color: #35d07f; }
  #loop .r { color: #f2564d; }
  #url {
    position: absolute; right: 96px; bottom: 42px;
    font-family: Silkscreen, monospace; font-size: 26px; letter-spacing: 2px; color: #f3f5f7;
  }
  #arrow { color: #7c8798; }
</style>
</head>
<body>
  <div id="stage">
    <div id="grid"></div>
    <div id="dither"></div>
    <div id="wrap">
      <div id="left">
        <div id="brandrow">
          <span id="mark"></span>
          <span id="word">berth</span>
        </div>
        <div id="tag">coins that build apps</div>
        <div id="rule"></div>
        <div id="loop">
          <div>one sentence <span id="arrow">→</span> <b>a coin launches on pump.fun</b></div>
          <div><span class="g">fees</span> fund an AI agent that builds the app</div>
          <div>the app's <span class="g">revenue</span> buys back &amp; <span class="r">burns</span> the coin</div>
        </div>
      </div>
    </div>
    <div id="url">berth.fun</div>
  </div>
  <script src="./mark.js"></script>
  <script>
    document.getElementById('mark').innerHTML = window.markSvg(104, '#35d07f');
  </script>
</body>
</html>
