<!doctype html>
<html><head><meta charset="utf-8"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--bg:#08090b;--fg:#f3f5f7;--fg2:#9ba5b4;--fg3:#7c8798;--line:#1e232c;--g:#35d07f;--r:#f2564d;}
html,body{margin:0;padding:0;}
#c{width:1920px;height:1080px;background:var(--bg);position:relative;overflow:hidden;font-family:Inter,sans-serif;color:var(--fg);}
#grid{position:absolute;inset:0;background-image:linear-gradient(#0f141a 1px,transparent 1px),linear-gradient(90deg,#0f141a 1px,transparent 1px);background-size:48px 48px;opacity:.5;}
#vig{position:absolute;inset:0;box-shadow:inset 0 0 260px 70px rgba(0,0,0,.62);}
#w{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:0 140px;}
.kick{font-family:Silkscreen,monospace;font-size:22px;letter-spacing:8px;color:var(--g);text-transform:uppercase;}
.big{font-weight:700;font-size:104px;letter-spacing:-2px;line-height:1;}
.big .g{color:var(--g);} .big .r{color:var(--r);}
.sub{font-size:36px;color:#9ba5b4;}
.brandrow{display:flex;align-items:center;gap:24px;}
.brandrow .wd{font-family:Silkscreen,monospace;font-size:104px;letter-spacing:4px;}
.url{font-family:Silkscreen,monospace;font-size:36px;letter-spacing:3px;}
.ul{height:3px;background:var(--g);width:360px;}
.foot{position:absolute;bottom:56px;left:0;right:0;text-align:center;font-size:22px;color:#7c8798;}
.foot .g{color:var(--g);}
</style></head>
<body>
<div id="c"><div id="grid"></div><div id="w"></div><div id="vig"></div></div>
<script>
window.BERTH_MARK=["................",".......##.......","......####......",".....######.....","....########....","...##########...","..############..","..##..####..##..","......####......","......####......","......####......","................","................",".######..######.",".######..######.","................"];
window.markSvg=function(s,c){let r="";for(let y=0;y<16;y++)for(let x=0;x<16;x++){if(window.BERTH_MARK[y][x]==='#')r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}return `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="${c}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${r}</svg>`;};
const p=new URLSearchParams(location.search); const w=document.getElementById('w'); const g=s=>(s||'').replace(/\{g\}/g,'<span class="g">').replace(/\{r\}/g,'<span class="r">').replace(/\{\/\}/g,'</span>');
const type=p.get('type')||'cap';
if(type==='end'){
  w.innerHTML=`<div class="brandrow"><span id="mk"></span><span class="wd">berth</span></div><div class="sub" style="margin-top:6px">${g(p.get('sub')||'coins that build apps')}</div><div class="url" style="margin-top:12px">berth.fun</div><div class="ul"></div>`;
  document.getElementById('mk').innerHTML=window.markSvg(92,'#35d07f');
  const f=document.createElement('div'); f.className='foot'; f.innerHTML='fees fund the build. <span class="g">revenue funds the burn.</span>'; document.getElementById('c').appendChild(f);
}else{
  const kick=p.get('kick'), big=p.get('big'), sub=p.get('sub');
  w.innerHTML=`${kick?`<div class="kick">${kick}</div>`:''}${big?`<div class="big">${g(big)}</div>`:''}${sub?`<div class="sub">${g(sub)}</div>`:''}`;
  const f=document.createElement('div'); f.className='foot'; f.textContent='berth.fun'; document.getElementById('c').appendChild(f);
}
</script>
</body></html>
