<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
  :root{ --bg:#08090b; --fg:#f3f5f7; --fg2:#9ba5b4; --fg3:#7c8798; --line:#1e232c; --line2:#2d3440; --g:#35d07f; --r:#f2564d; --info:#6ea8fe; }
  html,body{margin:0;padding:0;background:#000;}
  #stage{ width:1920px; height:1080px; background:var(--bg); position:relative; overflow:hidden; font-family:Inter,sans-serif; color:var(--fg); }
  #grid{ position:absolute; inset:0; background-image:linear-gradient(#0f141a 1px,transparent 1px),linear-gradient(90deg,#0f141a 1px,transparent 1px); background-size:48px 48px; opacity:.5; }
  .pix{ font-family:Silkscreen,monospace; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  .cur{ display:inline-block; width:.62em; height:1em; background:var(--g); transform:translateY(.12em); }
  #vig{ position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 260px 60px rgba(0,0,0,.65); }
</style>
</head>
<body>
  <div id="stage"><div id="grid"></div><div id="content"></div><div id="vig"></div></div>
  <script src="./kinetic.js"></script>
</body>
</html>
