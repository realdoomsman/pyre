<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#0A0A0C}
  /* the whole avatar is the tempered tile: obsidian body, heat at the base, wordmark in ink */
  #a{width:1024px;height:1024px;position:relative;overflow:hidden;
    background:
      radial-gradient(120% 34% at 50% 100%, #E9F1FF 0%, rgba(156,210,255,.9) 9%, rgba(62,139,255,.55) 26%, rgba(122,102,245,.16) 52%, transparent 78%),
      linear-gradient(180deg, #121215 0%, #0E0E12 34%, #1C1B2E 58%, #3B2F7A 76%, #7A66F5 88%, #3E8BFF 95%, #9CD2FF 100%);}
  #word{position:absolute;left:50%;top:50%;width:640px;transform:translate(-50%,-56%)}
</style>
<div id="a">
  <img id="word" src="wordmark.svg">
</div>
