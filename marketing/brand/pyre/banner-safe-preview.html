<!doctype html>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&display=swap');
  html,body{margin:0;background:#000}
  #b{width:1500px;height:500px;position:relative;overflow:hidden}
  #b>img.banner{position:absolute;inset:0;width:1500px;height:500px}
  /* X desktop: the avatar overlaps the header's bottom-left. 420×180 kept free. */
  #safe{position:absolute;left:0;bottom:0;width:420px;height:180px;border:1px dashed rgba(255,77,109,.7);box-sizing:border-box;background:rgba(255,77,109,.06)}
  #safe span{position:absolute;left:10px;top:8px;font:400 12px/1 'Geist Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:#FF4D6D}
  #avatar{position:absolute;left:60px;bottom:-140px;width:280px;height:280px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 8px #0A0A0C}
  #avatar img{width:100%;height:100%;display:block}
</style>
<div id="b">
  <img class="banner" src="banner.png">
  <div id="safe"><span>avatar zone 420×180</span></div>
  <div id="avatar"><img src="pfp.png"></div>
</div>
