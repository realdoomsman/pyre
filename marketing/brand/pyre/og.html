<!doctype html>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap');
  :root{--canvas:#0A0A0C;--ink:#F3F2EE;--ink2:#9B9891;--ink3:#62605B;--line:rgba(255,255,255,.07)}
  html,body{margin:0;background:#000}
  #c{width:1200px;height:630px;background:var(--canvas);position:relative;overflow:hidden;color:var(--ink)}
  /* the card itself is tempered: heat rises from its bottom edge */
  #heat{position:absolute;left:0;right:0;bottom:0;height:300px;
    background:
      radial-gradient(70% 60% at 50% 100%, rgba(156,210,255,.22), rgba(62,139,255,.16) 30%, rgba(122,102,245,.08) 58%, transparent 80%),
      linear-gradient(180deg, transparent, rgba(28,27,46,.5) 60%, rgba(59,47,122,.42));}
  #lip{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg, transparent, #9CD2FF 25%, #E9F1FF 50%, #9CD2FF 75%, transparent)}
  #lockup{position:absolute;left:72px;top:64px;height:74px}
  #tag{position:absolute;left:68px;top:196px;font:400 96px/1.02 'Instrument Serif',serif;letter-spacing:-0.02em;color:var(--ink)}
  #tag em{font-style:italic;color:#9D8CFF}
  #stats{position:absolute;left:72px;right:72px;bottom:60px;display:flex;gap:0;border-top:1px solid var(--line);padding-top:26px}
  .s{flex:1;font-family:'Geist Mono',monospace}
  .s+.s{border-left:1px solid var(--line);padding-left:32px}
  .s .l{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:12px}
  .s .v{font-size:36px;font-weight:400;color:var(--ink);letter-spacing:-.01em}
  #url{position:absolute;right:72px;top:86px;font:400 16px/1 'Geist Mono',monospace;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase}
</style>
<div id="c">
  <div id="heat"></div>
  <img id="lockup" src="lockup.svg">
  <div id="url">pyre.fun · Robinhood Chain</div>
  <div id="tag">coins that build apps.<br>revenue <em>burns</em> them.</div>
  <div id="stats">
    <div class="s"><div class="l">apps live</div><div class="v">—</div></div>
    <div class="s"><div class="l">revenue</div><div class="v">—</div></div>
    <div class="s"><div class="l">burned</div><div class="v">—</div></div>
  </div>
  <div id="lip"></div>
</div>
