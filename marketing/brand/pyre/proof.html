<!doctype html>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap');
  html,body{margin:0;background:#0A0A0C;color:#9B9891;font:12px/1 'Geist Mono',monospace;letter-spacing:.04em;text-transform:uppercase}
  #s{width:1400px;height:1100px;position:relative;padding:48px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .row{display:flex;align-items:flex-end;gap:32px;margin-bottom:28px}
  .row figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
  .light{background:#F4F1EA;color:#62605B;padding:24px;border-radius:8px}
  img{display:block;image-rendering:auto}
  h2{font-weight:400;font-size:12px;margin:0 0 16px}
</style>
<div id="s">
  <div>
    <h2>mark · 16 / 24 / 32 / 48 / 64 / 128 / 256</h2>
    <div class="row">
      <figure><img src="mark.svg" width="16"><span>16</span></figure>
      <figure><img src="mark.svg" width="24"><span>24</span></figure>
      <figure><img src="mark.svg" width="32"><span>32</span></figure>
      <figure><img src="mark.svg" width="48"><span>48</span></figure>
      <figure><img src="mark.svg" width="64"><span>64</span></figure>
      <figure><img src="mark.svg" width="128"><span>128</span></figure>
      <figure><img src="mark.svg" width="256"><span>256</span></figure>
    </div>
    <h2>mono light · 16 / 32 / 64 / 160</h2>
    <div class="row">
      <figure><img src="mark-mono-light.svg" width="16"></figure>
      <figure><img src="mark-mono-light.svg" width="32"></figure>
      <figure><img src="mark-mono-light.svg" width="64"></figure>
      <figure><img src="mark-mono-light.svg" width="160"></figure>
    </div>
    <div class="light">
      <h2>mono dark on ash paper</h2>
      <div class="row" style="margin:0">
        <figure><img src="mark-mono-dark.svg" width="16"></figure>
        <figure><img src="mark-mono-dark.svg" width="32"></figure>
        <figure><img src="mark-mono-dark.svg" width="64"></figure>
        <figure><img src="mark-mono-dark.svg" width="160"></figure>
        <figure><img src="lockup-on-light.svg" height="64"></figure>
      </div>
    </div>
  </div>
  <div>
    <h2>mark · 512</h2>
    <img src="mark.svg" width="512">
  </div>
  <div style="grid-column:1/3">
    <h2>wordmark · lockup</h2>
    <div class="row">
      <figure><img src="wordmark.svg" height="120"></figure>
      <figure><img src="lockup.svg" height="120"></figure>
      <figure><img src="lockup.svg" height="32"></figure><figure><img src="lockup.svg" height="20"></figure>
    </div>
  </div>
</div>
